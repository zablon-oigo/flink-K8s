apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata:
  name: flink-session-job
  namespace: flink
spec:
  deploymentName: flink-filter-session
  job:
    jarURI: http://minio.minio:9000/demo/flink-filter.jar
    entryClass: demo.KafkaHighValuePurchaseFilter
    parallelism: 2
    upgradeMode: stateless